<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NHN LIVE - Matches & Settings</title>
    <link rel="stylesheet" href="matches.css">
    <!-- مكتبة Hls.js لتشغيل البث على جميع المتصفحات والشاشات -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body class="dark-theme">

    <div class="matches-app-container">
        <!-- شريط الرأس العلوي -->
        <header class="matches-header">
            <div class="header-left">
                <div class="header-logo-circle">
                    <img src="logo.png" alt="NHN LIVE" onerror="this.onerror=null; this.src='https://raw.githubusercontent.com/mbdy08/matches/main/ic_logo.png';">
                </div>
                <div class="logo-title">
                    <span class="txt-white">NHN</span> <span class="txt-red">LIVE</span>
                </div>
            </div>

            <!-- زر التيليجرام العلوي -->
            <button id="btnTopTelegram" class="icon-btn-telegram" title="Telegram Channel">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="12" r="11" fill="#0088CC"/>
                    <path d="M5.5 11.8L17.5 7.2C18.1 7 18.6 7.4 18.4 8L16.3 17.5C16.2 18 15.6 18.2 15.2 17.9L12 15.4L10.4 17C10.2 17.2 9.9 17.3 9.7 17.3L10 13.5L16.8 7.6C17.1 7.3 16.7 7.2 16.4 7.4L8.2 12.5L5.6 11.6C5 11.4 5 11 5.5 11.8Z" fill="#FFFFFF"/>
                </svg>
            </button>
        </header>

        <!-- ============================================== -->
        <!-- قسم المباريات (Matches Section) -->
        <!-- ============================================== -->
        <main id="sectionMatches" class="main-tab-content">
            <!-- أزرار اختيار اليوم: الأمس / اليوم / الغد -->
            <div class="days-tab-bar">
                <button class="day-tab-btn" data-day="yesterday" id="tabYesterday">Yesterday</button>
                <button class="day-tab-btn active" data-day="today" id="tabToday">Today</button>
                <button class="day-tab-btn" data-day="tomorrow" id="tabTomorrow">Tomorrow</button>
            </div>

            <!-- مؤشر التحميل الدوار -->
            <div id="loadingMatches" class="loading-box">
                <div class="spinner"></div>
                <p id="txtLoading">Loading matches...</p>
            </div>

            <!-- حاوية بطاقات المباريات -->
            <div id="matchesListContainer" class="matches-list-container"></div>

            <!-- رسالة عند عدم توفر مباريات -->
            <div id="noMatchesBox" class="no-matches-box" style="display: none;">
                <p id="txtNoMatches">No matches scheduled</p>
            </div>
        </main>

        <!-- ============================================== -->
        <!-- قسم الإعدادات والمزيد (Settings Section) -->
        <!-- ============================================== -->
        <main id="sectionSettings" class="main-tab-content" style="display: none;">
            <h2 id="txtSettingsMainTitle" class="settings-main-title">Settings & More</h2>

            <!-- مجموعة الإعدادات العامة -->
            <div class="settings-group-card">
                <h4 id="txtHeaderGeneral" class="group-header-label">General Settings</h4>

                <!-- سطر اللغة -->
                <div class="setting-row">
                    <span id="txtLabelLanguage" class="setting-title">Language</span>
                    <div class="pill-switch-container">
                        <button id="btnSettingLangEn" class="pill-opt-btn active">English</button>
                        <button id="btnSettingLangAr" class="pill-opt-btn">العربية</button>
                    </div>
                </div>

                <!-- سطر المظهر (Dark / Light) -->
                <div class="setting-row">
                    <span id="txtLabelTheme" class="setting-title">Theme</span>
                    <div class="pill-switch-container">
                        <button id="btnSettingThemeLight" class="pill-opt-btn">Light</button>
                        <button id="btnSettingThemeDark" class="pill-opt-btn active">Dark</button>
                    </div>
                </div>

                <!-- سطر الإشعارات -->
                <div class="setting-row">
                    <span id="txtLabelNotification" class="setting-title">Notifications</span>
                    <div class="pill-switch-container">
                        <button id="btnSettingNotifOff" class="pill-opt-btn">Off</button>
                        <button id="btnSettingNotifOn" class="pill-opt-btn active">On</button>
                    </div>
                </div>
            </div>

            <!-- مجموعة التطبيق -->
            <div class="settings-group-card">
                <h4 id="txtHeaderApp" class="group-header-label">Application</h4>

                <div class="setting-clickable-row" id="rowDownloadApp">
                    <span id="txtLabelDownload" class="setting-title">Download App (APK)</span>
                    <span class="setting-arrow">›</span>
                </div>

                <div class="setting-clickable-row" id="rowShareApp">
                    <span id="txtLabelShare" class="setting-title">Share App with Friends</span>
                    <span class="setting-arrow">›</span>
                </div>

                <div class="setting-row">
                    <span id="txtLabelVersion" class="setting-title">App Version</span>
                    <span class="version-badge">1.0.0</span>
                </div>
            </div>

            <!-- مجموعة المعلومات والقوانين -->
            <div class="settings-group-card">
                <h4 id="txtHeaderInfo" class="group-header-label">Information</h4>

                <div class="setting-clickable-row" id="rowAboutUs">
                    <span id="txtLabelAbout" class="setting-title">About Us</span>
                    <span class="setting-arrow">›</span>
                </div>

                <div class="setting-clickable-row" id="rowPrivacyPolicy">
                    <span id="txtLabelPrivacy" class="setting-title">Privacy Policy</span>
                    <span class="setting-arrow">›</span>
                </div>

                <div class="setting-clickable-row" id="rowTerms">
                    <span id="txtLabelTerms" class="setting-title">Terms of Service</span>
                    <span class="setting-arrow">›</span>
                </div>

                <div class="setting-clickable-row" id="rowContact">
                    <span id="txtLabelContact" class="setting-title">Contact Support & Ads</span>
                    <span class="setting-arrow">›</span>
                </div>
            </div>
        </main>

        <!-- ============================================== -->
        <!-- شريط التنقل السفلي الثابت (Bottom Bar) -->
        <!-- ============================================== -->
        <nav class="bottom-nav-bar">
            <button id="btnNavMatches" class="nav-tab-btn active">
                <span class="nav-icon">⚽</span>
                <span id="txtNavMatches">Matches</span>
            </button>
            <button id="btnNavSettings" class="nav-tab-btn">
                <span class="nav-icon">⚙️</span>
                <span id="txtNavSettings">Settings</span>
            </button>
        </nav>
    </div>

    <!-- ============================================== -->
    <!-- مشغل الفيديو المنبثق بكامل الجودات (HD, SD, 4K) -->
    <!-- ============================================== -->
    <div id="playerOverlayModal" class="player-overlay" style="display: none;">
        <div class="player-content-box">
            <!-- شريط الجودات العلوي المتناسق -->
            <div class="player-top-header">
                <!-- أزرار الجودة الثلاثة -->
                <div class="player-quality-group">
                    <button id="btnQualHd" class="quality-btn active" onclick="switchStreamQuality('HD')">HD</button>
                    <button id="btnQualSd" class="quality-btn" onclick="switchStreamQuality('SD')">SD</button>
                    <button id="btnQual4k" class="quality-btn" onclick="switchStreamQuality('4K')">4K</button>
                </div>

                <!-- عداد المشاهدين وشارة LIVE وزر الإغلاق -->
                <div class="player-header-right">
                    <div class="live-badge-card">
                        <span>👥</span>
                        <span id="txtViewersCount">16.8K</span>
                        <div class="live-dot"></div>
                        <span class="live-txt">LIVE</span>
                    </div>

                    <button id="btnClosePlayer" class="btn-close-video" title="Close Player">✕</button>
                </div>
            </div>

            <!-- حاوية الفيديو -->
            <div class="video-screen-wrapper">
                <video id="hlsVideoPlayer" controls playsinline autoplay></video>
                <div id="playerBuffering" class="player-buffering" style="display: none;">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- النوافذ المنبثقة للمعلومات (About / Privacy / Terms / Contact) -->
    <div id="infoDialogModal" class="modal-backdrop" style="display: none;">
        <div class="info-dialog-card">
            <div class="info-dialog-header">
                <h3 id="txtDialogTitle">Title</h3>
                <button id="btnCloseInfoDialog" class="btn-close-dialog">✕</button>
            </div>
            <div id="infoDialogBody" class="info-dialog-body"></div>
        </div>
    </div>

    <script src="matches.js"></script>
</body>
</html>
